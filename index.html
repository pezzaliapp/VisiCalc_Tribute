<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>VisiCalc Tribute — pezzaliAPP</title>
  <meta name="theme-color" content="#0b1022">

  <!-- 🔹 cache-busting -->
  <link rel="manifest" href="./manifest.webmanifest?v=2.6b3">

  <style>
    body{margin:0;background:#0b1022;color:#eaf1ff;font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,Arial}
    header{display:flex;gap:8px;align-items:center;position:sticky;top:0;background:#0e1533cc;border-bottom:1px solid #1d244a;padding:8px}
    header input{flex:1;min-height:32px;background:#0b1230;border:1px solid #1d244a;border-radius:8px;color:#eaf1ff;padding:6px 8px}
    header button{background:#101739;border:1px solid #1d244a;color:#eaf1ff;border-radius:8px;padding:6px 10px}
    #gridWrap{overflow:auto;height:calc(100vh - 56px)}
    table{border-collapse:collapse;width:max-content;min-width:100%}
    th,td{border:1px solid #1d244a;min-width:72px;height:24px}
    th{background:#111a3f;position:sticky;top:0;z-index:1}
    .rowhdr{position:sticky;left:0;background:#111a3f;z-index:1;color:#a9b4cf}
    td{background:#0d1430}
    td.sel{outline:2px solid #2dd4bf;position:relative}
    td input{width:100%;height:100%;box-sizing:border-box;background:transparent;border:0;color:#eaf1ff;padding:2px 4px}
    .topright{margin-left:auto;display:flex;gap:6px}
    .hidden{display:none}
    /* Splash (CSS also in mobile.css for standalone) */
    #vc-splash{position:fixed;inset:0;background: radial-gradient(1000px 600px at 50% -20%, #172042, #0b1022);color:#eaf1ff;display:flex;align-items:center;justify-content:center;text-align:center;z-index:99999;opacity:1;transition:opacity .4s ease;font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,Arial}
    #vc-splash .box{padding:22px;border:1px solid #22305b;border-radius:14px;background:#0d1430;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    #vc-splash h1{margin:0 0 6px;font-size:20px}
    #vc-splash p{margin:0;color:#a9b4cf;font-size:13px}
  </style>
</head>
<body>
  <div id="vc-splash"><div class="box"><h1>🧮 VisiCalc Tribute — pezzaliAPP</h1><p>powered by pezzaliAPP.com</p></div></div>
  <header>
    <span style="white-space:nowrap">Cella:&nbsp;<strong id="cellName">A1</strong></span>
    <input id="formula-input" placeholder="Formula / valore... es. =A1+B1 o =SUM(A1:B3)">
    <div class="topright">
      <button id="btn-csv-exp">Export CSV</button>
      <button id="btn-csv-imp">Import CSV</button>
      <input id="csv-file" type="file" accept=".csv,text/csv" class="hidden">
      <button id="btn-readme">README</button>
      <button id="btn-timeline">Storia</button>
      <button id="btn-guide">Formule</button>
    </div>
  </header>
  <div id="gridWrap"><table id="grid"></table></div>

  <!-- 🔹 usa nuova versione che non mostra più gli zeri nelle celle vuote -->
  <script src="./app.v2.6.js?v=2.6b3"></script>

  <!-- 🔹 patch che carica automaticamente mobile.css e mobile-ui.js su smartphone -->
  <script src="./index_splash_mobile_patch.js?v=2.6b3"></script>

  <script>
    // Doc links
    document.getElementById('btn-readme').onclick = function(){ window.open('./readme.html','_blank'); };
    document.getElementById('btn-timeline').onclick = function(){ window.open('./visicalc_timeline.html','_blank'); };
    document.getElementById('btn-guide').onclick = function(){ window.open('./formulas_guide.html','_blank'); };
    // CSV
    document.getElementById('btn-csv-exp').onclick = App.exportCSV;
    document.getElementById('btn-csv-imp').onclick = function(){ document.getElementById('csv-file').click(); };
    document.getElementById('csv-file').addEventListener('change', App.importCSV, false);
    // Hide splash after load
    window.addEventListener('load', function(){
      setTimeout(function(){
        var s = document.getElementById('vc-splash');
        if(s){ s.style.opacity='0'; setTimeout(function(){ s.parentNode && s.parentNode.removeChild(s); }, 400); }
      }, 2000);
    });
  </script>
</body>
</html>
